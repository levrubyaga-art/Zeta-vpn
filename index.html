<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZetaVPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Material 3 Токены */
        :root {
            --md-sys-color-background: #F7FBF7;
            --md-sys-color-on-background: #191C19;
            --md-sys-color-surface: #FFFFFF;
            --md-sys-color-on-surface: #191C19;
            --md-sys-color-primary: #006C4C;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #89F8C7;
            --md-sys-color-on-primary-container: #002114;
            --md-sys-color-surface-variant: #DCE5DD;
            --md-sys-color-on-surface-variant: #404943;
            --md-sys-color-outline: #707973;
            
            --md-sys-shape-corner-large: 16px;
            --md-sys-shape-corner-full: 999px;
            
            --md-sys-elevation-1: 0px 1px 2px 0px rgba(0,0,0,0.3), 0px 1px 3px 1px rgba(0,0,0,0.15);
        }

        body.dark-theme {
            --md-sys-color-background: #101410;
            --md-sys-color-on-background: #E0E4DF;
            --md-sys-color-surface: #191C19;
            --md-sys-color-on-surface: #E0E4DF;
            --md-sys-color-primary: #6CDBAC;
            --md-sys-color-on-primary: #003825;
            --md-sys-color-primary-container: #005138;
            --md-sys-color-on-primary-container: #89F8C7;
            --md-sys-color-surface-variant: #404943;
            --md-sys-color-on-surface-variant: #BFC9C1;
            --md-sys-color-outline: #89938B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', -apple-system, sans-serif; }

        body {
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            transition: background-color 0.3s, color 0.3s;
        }

        .header { text-align: center; margin-bottom: 32px; margin-top: 20px; }
        h1 { font-size: 32px; font-weight: 400; color: var(--md-sys-color-primary); margin-bottom: 8px; letter-spacing: 0.5px; }
        .subtitle { font-size: 14px; color: var(--md-sys-color-on-surface-variant); }

        /* Material 3 Card */
        .card {
            background-color: var(--md-sys-color-surface);
            border-radius: var(--md-sys-shape-corner-large);
            box-shadow: var(--md-sys-elevation-1);
            width: 100%;
            max-width: 400px;
            padding: 24px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            border: 1px solid var(--md-sys-color-surface-variant);
        }
        
        .card:active { transform: scale(0.98); background-color: var(--md-sys-color-surface-variant); }

        .card-region {
            color: var(--md-sys-color-primary);
            font-weight: 500;
            font-size: 18px;
            margin-bottom: 12px;
            text-align: center;
        }

        .card-key {
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            color: var(--md-sys-color-on-surface-variant);
            word-break: break-all;
            text-align: center;
            line-height: 1.5;
            transition: color 0.3s;
        }

        /* Material 3 Button */
        .btn {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            border-radius: var(--md-sys-shape-corner-full);
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            max-width: 400px;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
            box-shadow: var(--md-sys-elevation-1);
        }
        .btn:active { opacity: 0.8; }
        .btn:disabled { background-color: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface-variant); box-shadow: none; cursor: not-allowed; }

        .stats { margin-bottom: 24px; font-size: 14px; color: var(--md-sys-color-on-surface-variant); text-align: center; }

        /* Уведомление */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            padding: 12px 24px;
            border-radius: var(--md-sys-shape-corner-full);
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            z-index: 1000;
            box-shadow: var(--md-sys-elevation-1);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="header">
        <h1>ZetaVPN</h1>
        <p class="subtitle">Бесплатный доступ</p>
    </div>

    <div id="stats" class="stats">
        Загрузка базы...
    </div>

    <!-- Карточка (при клике копирует) -->
    <div class="card" id="keyCard" onclick="copyKey()" style="display: none;">
        <div class="card-region" id="regionText"></div>
        <div class="card-key" id="keyText"></div>
    </div>

    <button class="btn" id="getKeyBtn" onclick="getNewKey()" disabled>
        Получить новый ключ
    </button>

    <div class="toast" id="toast">Скопировано</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Проверка системной темы
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark-theme');
        }

        const SOURCES = [
            "https://raw.githubusercontent.com/flaafix/AetrisVPN/main/AetrisVPN.txt",
            "https://raw.githubusercontent.com/aviamastersgh/vpn-free-russia/main/verified_configs.txt",
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt",
            "https://raw.githubusercontent.com/PrinceVSFX/Hysteria2-Configs/main/Configs_list.txt",
            "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/v2ray-base64.txt",
        ];

        let allKeys = [];
        let currentKey = "";

        async function loadKeys() {
            const statsEl = document.getElementById('stats');
            
            for (const url of SOURCES) {
                try {
                    const res = await fetch(url);
                    const text = await res.text();
                    for (const line of text.split('\n')) {
                        if (line.includes('://') && line.includes('#')) {
                            allKeys.push(line.trim());
                        }
                    }
                } catch (e) { console.error(e); }
            }

            allKeys = [...new Set(allKeys)];

            if (allKeys.length > 0) {
                statsEl.innerHTML = `Доступно серверов: ${allKeys.length}`;
                document.getElementById('getKeyBtn').disabled = false;
                document.getElementById('keyCard').style.display = 'flex';
                getNewKey();
            } else {
                statsEl.innerHTML = `Не удалось загрузить источники`;
            }
        }

        function getNewKey() {
            if (allKeys.length === 0) return;
            const key = allKeys[Math.floor(Math.random() * allKeys.length)];
            const parts = key.split('#');
            const region = parts.length > 1 ? parts[1].split('|')[0].trim() : 'Другое';
            
            currentKey = parts[0];
            document.getElementById('regionText').innerText = region;
            document.getElementById('keyText').innerText = currentKey;
        }

        function copyKey() {
            if (!currentKey) return;

            // Копирование
            navigator.clipboard.writeText(currentKey).then(() => {
                showToast();
                tg.HapticFeedback.notificationOccurred('success');
            }).catch(() => {
                // Fallback
                const textArea = document.createElement("textarea");
                textArea.value = currentKey;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        loadKeys();
    </script>
</body>
</html>
